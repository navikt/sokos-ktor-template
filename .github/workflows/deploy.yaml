name: Deploy application

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - 'CODEOWNERS'
      - '.gitignore'
      - '.editorconfig'
      - '.scripts'
      - 'dokumentasjon/**'
      - '.github/workflows/build-pr.yaml'
      - '.github/workflows/codeql-scan.yaml'
      - '.github/workflows/digestabot-automerge.yaml'
      - '.github/workflows/digestabot-update.yaml'
      - '.github/workflows/manual-deploy.yaml'
      - '.github/dependabot.yaml'
      - '.github/instructions/**'
      - '.github/skills/**'

env:
  TZ: Europe/Oslo

jobs:
  build-and-test:
    permissions:
      contents: read
    name: Build and test
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@9fd407aea00d8a5cc86be201b21b283ad165d82c # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.0
    with:
      upload-artifact: true

  dependency-submission:
    permissions:
      contents: write
    name: Submit dependency graph
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-dependency-submission.yaml@9fd407aea00d8a5cc86be201b21b283ad165d82c # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-dependency-submission.yaml@v1.1.0

  build-push-image-dev:
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push dev image
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@9fd407aea00d8a5cc86be201b21b283ad165d82c # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.1.0
    secrets: inherit
    with:
      image-suffix: "dev"
      dockerfile: "./.nais/dev/Dockerfile"
      use-artifact: true

#  build-push-image-prod:
#    permissions:
#      contents: read
#      id-token: write
#    needs: [build-and-test]
#    name: Build push prod image
#    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@9fd407aea00d8a5cc86be201b21b283ad165d82c # ratchet:navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.1.0
#    secrets: inherit
#    with:
#      dockerfile: "./.nais/prod/Dockerfile"
#      use-artifact: true

  deploy-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-dev]
    name: Deploy to dev-gcp
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@9fd407aea00d8a5cc86be201b21b283ad165d82c # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.0
    with:
      cluster: dev-gcp
      resource: .nais/dev/naiserator-dev.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}

#  deploy-prod:
#    permissions:
#      contents: read
#      id-token: write
#      pull-requests: write
#      deployments: write
#    needs: [build-push-image-prod, deploy-dev]
#    name: Deploy to prod-gcp
#    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@9fd407aea00d8a5cc86be201b21b283ad165d82c # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.0
